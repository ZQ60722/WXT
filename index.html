        // 1. 音乐控制

        var audio = document.getElementById('bgMusic');
        var btn = document.getElementById('musicBtn');
        var icon = document.getElementById('musicIcon');
        var hint = document.getElementById('clickHint');
        var isPlaying = true;
        var musicStarted = false;

        function updateMusicUI() {
            icon.textContent = isPlaying ? '🔊' : '🔇';
            btn.className = isPlaying ? 'playing' : 'muted';
        }

        function startMusic() {
            if (musicStarted) return;
            musicStarted = true;
            audio.play().then(function() {
                hint.style.display = 'none';
                updateMusicUI();
            }).catch(function() {
                hint.style.display = 'block';
                var clickHandler = function() {
                    audio.play().then(function() {
                        hint.style.display = 'none';
                        updateMusicUI();
                    }).catch(function() {});
                    document.removeEventListener('click', clickHandler);
                    document.removeEventListener('touchstart', clickHandler);
                };
                document.addEventListener('click', clickHandler);
                document.addEventListener('touchstart', clickHandler);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(startMusic, 300);
        });

        function toggleMusic() {
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                isPlaying = true;
                audio.play().catch(function() {});
            }
            updateMusicUI();
        }
        window.toggleMusic = toggleMusic;

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                if (isPlaying && !audio.paused) audio.pause();
            } else {
                if (isPlaying && audio.paused) audio.play().catch(function() {});
            }
        });
        audio.addEventListener('ended', function() {
            if (isPlaying) audio.play().catch(function() {});
        });
        updateMusicUI();

        // ==========================================
        // 4. 首页初始化
        // ==========================================
        function reinitHomeScripts() {
            // 灵芝图片切换
            if (typeof window.lzSwap !== 'function') {
                window.lzSwap = function(src, el) {
                    var main = document.querySelector('.lz-main-img');
                    if (main) main.style.backgroundImage = 'url(' + src + ')';
                    document.querySelectorAll('.lz-thumb').forEach(function(t) { t.classList.remove('active'); });
                    if (el) el.classList.add('active');
                };
            }
            document.querySelectorAll('.lz-thumb').forEach(function(el) {
                el.onclick = function() {
                    var src = this.style.backgroundImage.slice(4, -1).replace(/"/g, '');
                    window.lzSwap(src, this);
                };
            });
            
            // 语言切换按钮
            var langBtn = document.getElementById('langSwitchBtn');
            if (langBtn && typeof window.toggleLanguage === 'function') {
                langBtn.onclick = window.toggleLanguage;
            }
            
            // ECharts 地图初始化 - 调用 script.js 中的完整地图初始化函数
            if (typeof initZengchengMap === 'function') {
                setTimeout(function() {
                    initZengchengMap();
                }, 100);
            }
            
            // 🔥 关键修复：重新初始化滚动动画
            // 重置所有 section 的 is-active 状态
            var sections = document.querySelectorAll('.section');
            sections.forEach(function(section) {
                section.classList.remove('is-active');
            });
            
            // 重新设置 IntersectionObserver
            if ('IntersectionObserver' in window) {
                var container = document.querySelector('.container');
                if (container) {
                    var io = new IntersectionObserver(function (entries) {
                        entries.forEach(function (entry) {
                            if (entry.isIntersecting) {
                                entry.target.classList.add('is-active');
                                io.unobserve(entry.target);
                            }
                        });
                    }, { root: container, threshold: 0.3 });
                    
                    sections.forEach(function (s) { 
                        io.observe(s); 
                    });
                }
            } else {
                // 降级：直接显示所有内容
                sections.forEach(function (s) { s.classList.add('is-active'); });
            }
            
            updateScrollIndicator(1);
        }

        function updateScrollIndicator(activeIndex) {
            var dots = document.querySelectorAll('.scroll-dot');
            dots.forEach(function(dot, index) {
                dot.classList.toggle('active', index === activeIndex - 1);
            });
        }

        // ==========================================
        // 5. 🔥 核心修复：重新触发 DOMContentLoaded
        // ==========================================
        function reinitializeSubPage(pageName) {
            console.log('🔄 重新触发子页面初始化:', pageName);
            
            // 方法1：触发 DOMContentLoaded 事件
            var event = new Event('DOMContentLoaded');
            document.dispatchEvent(event);
            
            // 方法2：如果是 tech 页面，额外调用初始化函数
            if (pageName === 'tech') {
                setTimeout(function() {
                    // 尝试调用 tech.js 的初始化函数
                    if (typeof initializeCorpusSystem === 'function') {
                        console.log('✅ 调用 initializeCorpusSystem()');
                        initializeCorpusSystem();
                    } else {
                        console.log('⏳ initializeCorpusSystem 未定义，尝试再次触发事件');
                        // 再次触发 DOMContentLoaded
                        var event2 = new Event('DOMContentLoaded');
                        document.dispatchEvent(event2);
                        
                        // 如果还是不行，模拟点击第一个标签
                        setTimeout(function() {
                            var gridItems = document.querySelectorAll('.grid-item');
                            if (gridItems.length > 0 && gridItems[0]) {
                                console.log('🔄 模拟点击第一个标签');
                                gridItems[0].click();
                            }
                        }, 300);
                    }
                }, 400);
            }
            
            // knowledge-graph 页面
            if (pageName === 'knowledge-graph') {
                setTimeout(function() {
                    if (typeof initGraph === 'function') {
                        initGraph();
                    }
                }, 400);
            }
        }

        // ==========================================
        // 6. 导航函数
        // ==========================================
        function navigateTo(pageName) {
            var config = PAGE_CONFIG[pageName];
            if (!config) { console.warn('未知页面:', pageName); return; }
            if (currentPage === pageName) return;

            currentPage = pageName;
            var container = document.getElementById('appContainer');
            var indicator = document.getElementById('scrollIndicator');
            var backBtn = document.getElementById('backHomeBtn');

            if (pageName === 'home') {
                container.innerHTML = getHomePageHTML();
                reinitHomeScripts();
                document.title = '岭南农遗服务生态';
                indicator.classList.remove('hidden');
                backBtn.classList.remove('show');
                return;
            }

            indicator.classList.add('hidden');
            backBtn.classList.add('show');

            container.innerHTML = '<div class="page-loading"><span>⏳</span> 加载中...</div>';

            fetch(config.file)
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.text();
                })
                .then(function(html) {
                    container.innerHTML = html;
                    document.title = config.title + ' - 岭南农遗服务生态';
                    window.scrollTo(0, 0);

                    // 🔥 修复：加载外部脚本和内联脚本
                    var externalScripts = [];
                    var inlineScripts = [];
                    
                    // 提取外部脚本 src
                    var externalRegex = /<script\s+src=["']([^"']+)["'][^>]*><\/script>/g;
                    var extMatch;
                    while ((extMatch = externalRegex.exec(html)) !== null) {
                        externalScripts.push(extMatch[1]);
                    }
                    
                    // 提取内联脚本
                    var inlineRegex = /<script>([\s\S]*?)<\/script>/g;
                    var inlineMatch;
                    while ((inlineMatch = inlineRegex.exec(html)) !== null) {
                        var code = inlineMatch[1].trim();
                        if (code) inlineScripts.push(code);
                    }
                    
                    // 加载外部脚本（按顺序）
                    function loadScriptsSequentially(scripts, callback) {
                        if (scripts.length === 0) {
                            callback();
                            return;
                        }
                        
                        var script = document.createElement('script');
                        script.src = scripts[0];
                        script.onload = function() {
                            loadScriptsSequentially(scripts.slice(1), callback);
                        };
                        script.onerror = function() {
                            console.warn('外部脚本加载失败:', scripts[0]);
                            loadScriptsSequentially(scripts.slice(1), callback);
                        };
                        document.head.appendChild(script);
                    }
                    
                    // 先加载外部脚本，再执行内联脚本
                    loadScriptsSequentially(externalScripts, function() {
                        inlineScripts.forEach(function(code) {
                            try {
                                var func = new Function(code);
                                func();
                            } catch (e) {
                                console.warn('内联脚本执行失败:', e.message);
                            }
                        });
                        
                        // 🔥 核心修复：重新触发子页面初始化
                        reinitializeSubPage(pageName);
                    });

                    console.log('✅ 页面加载完成:', config.title);
                })
                .catch(function(err) {
                    console.error('页面加载失败:', err);
                    container.innerHTML =
                        '<div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;color:rgba(255,255,255,0.7);text-align:center;padding:20px;">' +
                        '<div style="font-size:48px;margin-bottom:20px;">😅</div>' +
                        '<p style="font-size:20px;">页面加载失败</p>' +
                        '<p style="font-size:14px;margin-top:8px;opacity:0.6;">' + err.message + '</p>' +
                        '<button onclick="navigateTo(\'home\')" style="margin-top:24px;padding:12px 36px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);border-radius:10px;color:#fff;cursor:pointer;font-size:16px;font-family:inherit;">🏠 返回首页</button>' +
                        '</div>';
                });
        }

        // ==========================================
        // 7. 拦截所有链接
        // ==========================================
        document.addEventListener('click', function(e) {
            var link = e.target.closest('a[href]');
            if (!link) return;
            var href = link.getAttribute('href');
            
            if (href && href.startsWith('pages/')) {
                e.preventDefault();
                var pageName = href.replace('pages/', '').replace('.html', '');
                if (PAGE_CONFIG[pageName]) {
                    navigateTo(pageName);
                }
            }
            
            if (href && href.startsWith('#')) { return; }
            if (href && href.startsWith('javascript:')) { return; }
        });

        // ==========================================
        // 8. 启动应用
        // ==========================================
        document.getElementById('appContainer').innerHTML = getHomePageHTML();
        reinitHomeScripts();
        document.title = '岭南农遗服务生态';

        console.log('🎵 SPA 模式已启动，页面切换时音乐不会中断！');
        console.log('📄 可用页面: home, tech, industry, knowledge-graph, detail');
        console.log('💡 子页面加载后会重新触发 DOMContentLoaded，让您的 tech.js 自己初始化');
    </script>
