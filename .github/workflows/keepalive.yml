name: Keep Supabase awake

# 防止 Supabase 免费库因「空闲 7 天」自动暂停。
# 每 10 分钟用匿名 key 轻量访问一次 REST 端点即可保持活跃。
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -fsS "https://YOUR_PROJECT_REF.supabase.co/rest/v1/" \
            -H "apikey: YOUR_SUPABASE_ANON_KEY" || true
