<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广东非遗知识图谱</title>
    <link rel="stylesheet" href="../CSS/knowledge-graph.css">
    <link rel="stylesheet" href="../CSS/theme.css">
</head>
<body>
    <div class="academic-container">
        <!-- 顶部标题栏 -->
        <header class="academic-header">
            <div class="header-content">
                <h1 class="header-title">
                    <span class="title-icon">🎓</span>
                    广东非遗知识图谱
                </h1>
                <span class="five-band thin header-band"></span>
                <p class="header-subtitle">Guangdong Intangible Cultural Heritage Knowledge Graph</p>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="academic-main">
            <!-- 中间图谱区域 -->
            <section class="graph-section">
                <div class="graph-canvas" id="graphCanvas">
                    <!-- 学术风格背景网格 -->
                    <div class="academic-grid"></div>
                    <!-- 星辰粒子背景 -->
                    <div class="starfield" aria-hidden="true"></div>
                    <!-- 缩放提示 -->
                    <div class="zoom-hint">
                        <kbd>滚轮</kbd> 缩放 <kbd>拖拽</kbd> 移动
                    </div>
                    <svg id="knowledgeGraph" width="100%" height="100%">
                        <defs>
                            <!-- 中心节点渐变 - 暖金渐变 -->
                            <radialGradient id="centerGradient" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#FDF6E7;stop-opacity:1" />
                                <stop offset="30%" style="stop-color:#F2D8A8;stop-opacity:1" />
                                <stop offset="60%" style="stop-color:#D99A3E;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#8E5A1E;stop-opacity:1" />
                            </radialGradient>
                            
                            <!-- 增城荔枝渐变 -->
                            <radialGradient id="zengchengGradient" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#E86A5A;stop-opacity:1" />
                                <stop offset="30%" style="stop-color:#C24B3F;stop-opacity:1" />
                                <stop offset="60%" style="stop-color:#A52B28;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#8E2421;stop-opacity:1" />
                            </radialGradient>
                            
                            <!-- 化州化橘红渐变 -->
                            <radialGradient id="huazhouGradient" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#F0A44E;stop-opacity:1" />
                                <stop offset="30%" style="stop-color:#D9792B;stop-opacity:1" />
                                <stop offset="60%" style="stop-color:#B85F1C;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#9A5F1C;stop-opacity:1" />
                            </radialGradient>
                            
                            <!-- 潮州单丛茶渐变 - 茶青 -->
                            <radialGradient id="chaozhouGradient" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#A8C2A0;stop-opacity:1" />
                                <stop offset="30%" style="stop-color:#7DA57E;stop-opacity:1" />
                                <stop offset="60%" style="stop-color:#5F7A55;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#3A5440;stop-opacity:1" />
                            </radialGradient>

                            <!-- 东莞莞香渐变 - 沉香褐 -->
                            <radialGradient id="dongguanGradient" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#D9C2A6;stop-opacity:1" />
                                <stop offset="30%" style="stop-color:#B3926F;stop-opacity:1" />
                                <stop offset="60%" style="stop-color:#6B5340;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#4A3A2A;stop-opacity:1" />
                            </radialGradient>
                            
                            <!-- 新会陈皮渐变 -->
                            <radialGradient id="xinhuiGradient" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#F2C877;stop-opacity:1" />
                                <stop offset="30%" style="stop-color:#D9A03C;stop-opacity:1" />
                                <stop offset="60%" style="stop-color:#C08A2E;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#A6782A;stop-opacity:1" />
                            </radialGradient>

                            <!-- 梅州灵芝渐变 -->
                            <radialGradient id="meizhouGradient" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#E3C89A;stop-opacity:1" />
                                <stop offset="30%" style="stop-color:#B08A4A;stop-opacity:1" />
                                <stop offset="60%" style="stop-color:#8A6733;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#6B4A20;stop-opacity:1" />
                            </radialGradient>
                            
                            <!-- 二级节点渐变 -->
                            <radialGradient id="zengchengGradientL2" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#F08A7E;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#E86A5A;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#C24B3F;stop-opacity:1" />
                            </radialGradient>
                            
                            <radialGradient id="huazhouGradientL2" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#F5C58A;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#F0A44E;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#D9792B;stop-opacity:1" />
                            </radialGradient>
                            
                            <radialGradient id="chaozhouGradientL2" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#C9DBBF;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#A8C2A0;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#7DA57E;stop-opacity:1" />
                            </radialGradient>

                            <radialGradient id="dongguanGradientL2" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#E8D9C5;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#D9C2A6;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#A5836A;stop-opacity:1" />
                            </radialGradient>
                            
                            <radialGradient id="xinhuiGradientL2" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#FBE7B8;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#F2C877;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#D9A03C;stop-opacity:1" />
                            </radialGradient>
                            
                            <!-- 三级节点渐变 - 更亮的版本 -->
                            <radialGradient id="zengchengGradientL3" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#F2AEA6;stop-opacity:1" />
                                <stop offset="40%" style="stop-color:#F08A7E;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#E86A5A;stop-opacity:1" />
                            </radialGradient>
                            
                            <radialGradient id="huazhouGradientL3" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#F8D6A0;stop-opacity:1" />
                                <stop offset="40%" style="stop-color:#F5C58A;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#F0A44E;stop-opacity:1" />
                            </radialGradient>
                            
                            <radialGradient id="chaozhouGradientL3" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#E3EDDA;stop-opacity:1" />
                                <stop offset="40%" style="stop-color:#C9DBBF;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#A8C2A0;stop-opacity:1" />
                            </radialGradient>

                            <radialGradient id="dongguanGradientL3" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#F3EAE0;stop-opacity:1" />
                                <stop offset="40%" style="stop-color:#E8D9C5;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#D9C2A6;stop-opacity:1" />
                            </radialGradient>
                            
                            <radialGradient id="xinhuiGradientL3" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#FDF3D4;stop-opacity:1" />
                                <stop offset="40%" style="stop-color:#FBE7B8;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#F2C877;stop-opacity:1" />
                            </radialGradient>

                            <!-- 梅州灵芝 L2/L3 渐变 -->
                            <radialGradient id="meizhouGradientL2" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#F0DCB0;stop-opacity:1" />
                                <stop offset="50%" style="stop-color:#E3C89A;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#B08A4A;stop-opacity:1" />
                            </radialGradient>

                            <radialGradient id="meizhouGradientL3" cx="30%" cy="30%" r="70%">
                                <stop offset="0%" style="stop-color:#F7E9CC;stop-opacity:1" />
                                <stop offset="40%" style="stop-color:#F0DCB0;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#E3C89A;stop-opacity:1" />
                            </radialGradient>

                            <!-- 高级阴影滤镜 -->
                            <filter id="premiumShadow" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
                                <feOffset in="blur" dx="0" dy="6" result="offsetBlur"/>
                                <feComponentTransfer>
                                    <feFuncA type="linear" slope="0.25"/>
                                </feComponentTransfer>
                                <feMerge>
                                    <feMergeNode in="offsetBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                            
                            <!-- 发光滤镜 -->
                            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                            
                            <!-- 选中状态发光 -->
                            <filter id="selectedGlow" x="-100%" y="-100%" width="300%" height="300%">
                                <feGaussianBlur stdDeviation="8" result="blur"/>
                                <feFlood flood-color="#F2C877" flood-opacity="0.9"/>
                                <feComposite in2="blur" operator="in"/>
                                <feMerge>
                                    <feMergeNode/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        
                        <g id="links"></g>
                        <g id="nodes"></g>
                        <g id="labels"></g>
                    </svg>
                </div>

                <!-- 图例 -->
                <div class="graph-legend">
                    <div class="legend-item">
                        <div class="legend-dot center"></div>
                        <span>广东非遗 Center</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot zengcheng"></div>
                        <span>增城荔枝 Lychee</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot huazhou"></div>
                        <span>化州橘红 Huajuhong</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot chaozhou"></div>
                        <span>潮州单丛 Tea</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot dongguan"></div>
                        <span>东莞莞香 Incense</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot xinhui"></div>
                        <span>新会陈皮 Chenpi</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-dot meizhou"></div>
                        <span>梅州灵芝 Lingzhi</span>
                    </div>
                </div>
            </section>

            <!-- 右侧详情面板 -->
            <aside class="detail-panel" id="detailPanel">
                <div class="detail-placeholder">
                    <div class="placeholder-icon">📖</div>
                    <p>点击节点查看详细信息</p>
                    <p class="placeholder-sub">Click node to view details</p>
                </div>
            </aside>
        </main>
    </div>

    <script src="../JS/knowledge-graph.js"></script>
</body>
</html>
